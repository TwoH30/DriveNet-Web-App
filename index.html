<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1A7F37">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DriveNet">
  <title>DriveNet - Revenu VTC</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Onboarding -->
  <div id="onboarding" class="screen hidden">
    <div class="onboarding-content">
      <div class="onboarding-icon">🚕</div>
      <h1>Bienvenue sur DriveNet</h1>
      <p>Avant de commencer, renseignez deux informations qui serviront à calculer votre bénéfice. Vous pourrez les modifier à tout moment dans les paramètres.</p>
      <label>Consommation du véhicule (Fcfa pour 100 km)
        <input type="number" id="ob-conso" value="6500" inputmode="decimal">
        <small>Coût du carburant pour 100 km (ex. 6 500)</small>
      </label>
      <label>Recette hebdomadaire à verser (Fcfa)
        <input type="number" id="ob-recette" value="60000" inputmode="decimal">
        <small>Montant fixe à verser au propriétaire chaque semaine</small>
      </label>
      <button id="ob-start" class="btn-primary">Commencer</button>
    </div>
  </div>

  <!-- Application principale -->
  <div id="app" class="screen hidden">
    <header>
      <h1>DriveNet</h1>
      <div class="header-actions">
        <button id="btn-history" class="icon-btn" title="Historique">📜</button>
        <button id="btn-settings" class="icon-btn" title="Paramètres">⚙️</button>
      </div>
    </header>
    <main>
      <section class="card hero" id="hero"></section>
      <section class="card details" id="details"></section>
      <section class="card recette" id="recette"></section>
      <button id="btn-new-pointage" class="btn-primary">+ Nouveau pointage</button>
      <button id="btn-new-semaine" class="btn-secondary">Nouvelle semaine</button>
      <section id="pointages-list"></section>
    </main>
  </div>

  <!-- Modal pointage -->
  <div id="modal-pointage" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Nouveau pointage</h2>
      <form id="form-pointage">
        <label>Argent généré (Fcfa)
          <input type="number" id="p-cash" inputmode="decimal" step="any" required>
          <small>Ce que tu as comme montant total sur toi actuellement</small>
        </label>
        <label>Distance parcourue (km)
          <input type="number" id="p-km" inputmode="decimal" step="any" required>
          <small>Le total de kilomètres que tu as roulés jusqu'à maintenant</small>
        </label>
        <label>Carburant mis (Fcfa)
          <input type="number" id="p-carburant" inputmode="decimal" step="any" required>
          <small>Carburant ajouté à la station</small>
        </label>
        <label>Recharge solde Yango (Fcfa)
          <input type="number" id="p-yango" inputmode="decimal" step="any" required>
        </label>
        <label>Recette à verser (Fcfa)
          <input type="number" id="p-recette" inputmode="decimal" step="any" required>
          <small>Recette que tu vas verser sur l'argent que tu as</small>
        </label>
        <div id="apercu" class="apercu"></div>
        <div class="modal-actions">
          <button type="button" id="btn-cancel-pointage" class="btn-secondary">Annuler</button>
          <button type="submit" class="btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal paramètres -->
  <div id="modal-settings" class="modal hidden">
    <div class="modal-content">
      <h2>Paramètres</h2>
      <form id="form-settings">
        <label>Recette hebdomadaire (Fcfa)
          <input type="number" id="s-recette" inputmode="decimal" step="any" required>
          <small>Montant fixe à verser au propriétaire chaque semaine</small>
        </label>
        <label>Consommation du véhicule (Fcfa pour 100 km)
          <input type="number" id="s-conso" inputmode="decimal" step="any" required>
          <small>Coût du carburant pour 100 km (ex. 6 500)</small>
        </label>
        <div class="switch-row">
          <span>Mode sombre automatique (18h - 6h)</span>
          <input type="checkbox" id="s-dark-auto">
        </div>
        <div class="switch-row" id="manual-dark-row">
          <span>Mode sombre manuel</span>
          <input type="checkbox" id="s-dark">
        </div>
        <div class="modal-actions">
          <button type="button" id="btn-cancel-settings" class="btn-secondary">Annuler</button>
          <button type="submit" class="btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal historique -->
  <div id="modal-history" class="modal hidden">
    <div class="modal-content">
      <h2>Historique</h2>
      <div id="history-list"></div>
      <div class="modal-actions">
        <button type="button" id="btn-close-history" class="btn-primary">Fermer</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
